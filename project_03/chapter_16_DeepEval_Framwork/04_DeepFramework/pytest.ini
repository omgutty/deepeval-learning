[pytest]
pythonpath = .
testpaths = tests
addopts = -v --tb=short
markers =
    smoke: free wiring checks, no LLM calls
    chatbot: targets Subsystem A, the ShopSphere chatbot
    quality: answer quality metrics
    safety: bias, toxicity, PII
    geval: custom G-Eval rubrics
    slow: makes real LLM calls
    needs_chatbot: skipped unless the chatbot is reachable
